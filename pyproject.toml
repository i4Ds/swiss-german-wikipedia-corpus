[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-german-wikipedia-corpus"
version = "0.1.0"
description = "Extraction, translation and release tools for a Swiss German Wikipedia corpus"
requires-python = ">=3.10"
dependencies = ["requests", "mwparserfromhell", "python-dotenv", "openai", "httpx", "huggingface_hub", "datasets", "pyarrow"]

[tool.setuptools]
py-modules = ["corpus_paths"]
